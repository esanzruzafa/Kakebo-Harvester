name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $expected = "v" + (node -p "require('./package.json').version")
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match package version $expected."
          }

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm run audit:all

      - name: Validate source
        run: npm run check

      - name: Build portable executable
        run: npm run desktop:dist

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath "release/portable" -Filter "Kakebo-Harvester-*.exe" | Select-Object -First 1
          if (-not $artifact) {
            throw "Portable executable was not generated."
          }
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($artifact.FullName).sha256" -Value "$hash  $($artifact.Name)" -Encoding ascii

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --generate-notes --title "Kakebo Harvester $env:RELEASE_TAG"
          }
          $artifact = Get-ChildItem -LiteralPath "release/portable" -Filter "Kakebo-Harvester-*.exe" | Select-Object -First 1
          gh release upload $env:RELEASE_TAG $artifact.FullName "$($artifact.FullName).sha256" --clobber
