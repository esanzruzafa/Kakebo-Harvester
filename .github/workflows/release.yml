name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $expected = "v" + (node -p "require('./package.json').version")
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match package version $expected."
          }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "$env:RELEASE_TAG is not an existing repository tag."
          }
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{}"
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) {
            throw "Tag $env:RELEASE_TAG does not point to the checked-out commit."
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $env:RELEASE_TAG does not point to a commit contained in main."
          }

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm run audit:all

      - name: Validate source
        run: npm run check

      - name: Build portable executable
        run: npm run desktop:dist

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $baseName = "Kakebo-Harvester-$version-x64"
          $artifacts = @(
            "release/portable/$baseName.exe",
            "release/portable/$baseName-complete-package.zip"
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Release artifact was not generated: $artifact"
            }
            $file = Get-Item -LiteralPath $artifact
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$($file.FullName).sha256" -Value "$hash  $($file.Name)" -Encoding ascii
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -eq 0) {
            throw "A release already exists for $env:RELEASE_TAG; refusing to overwrite it. Publish a new version tag instead."
          }
          $version = node -p "require('./package.json').version"
          $baseName = "Kakebo-Harvester-$version-x64"
          $executable = "release/portable/$baseName.exe"
          $completePackage = "release/portable/$baseName-complete-package.zip"
          gh release create $env:RELEASE_TAG `
            $executable "$executable.sha256" `
            $completePackage "$completePackage.sha256" `
            --verify-tag --generate-notes --title "Kakebo Harvester $env:RELEASE_TAG"
