<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting Kakebo Harvester</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="loading-window">
    <main class="loading-card">
      <img class="loading-brand-icon" src="./icon.svg" alt="" />
      <div>
        <p class="loading-name">Kakebo Harvester</p>
        <p class="loading-message">Starting your local workspace…</p>
      </div>
      <span class="loading-spinner" aria-label="Loading"></span>
    </main>
  </body>
</html>
